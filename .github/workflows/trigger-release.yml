name: Trigger Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Release Version ${{ inputs.version }}
    runs-on: ubuntu-latest
    environment: Installer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch MSI asset from source release
        id: fetch-msi
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          repo: "engrbm87/Pconn-Installer"
          version: tags/${{ inputs.version }}
          file: "PconnInstaller-${{ inputs.version }}-x64.msi"
          target: "./PconnInstaller-${{ inputs.version }}-x64.msi"
          token: ${{ secrets.PCONN_PAT }}

      - name: Update docs version
        run: |
          version="${{ inputs.version }}"
          cat <<'EOF' > docs/source/__version__.py
          """Application Version Information."""

          VERSION = "${version}"
          EOF
        shell: bash

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/source/__version__.py
          if git diff --quiet --cached; then
            echo "No version changes to commit."
          else
            git commit -m "Bump docs version to ${{ inputs.version }}"
            git push
          fi
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release and upload MSI
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          files: "./PconnInstaller-${{ inputs.version }}-x64.msi"

      - name: Record release summary
        run: |
          printf "Released version %s\n" "${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
