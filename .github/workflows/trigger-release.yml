name: Trigger Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Release Version ${{ inputs.version }}
    runs-on: ubuntu-latest
    environment: Installer
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync dev into main
        run: |
          git merge origin/dev --no-ff -m ${{ inputs.version }}
          git push origin main

      - name: Fetch MSI asset from source release
        id: fetch-msi
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          repo: "engrbm87/Pconn-Installer"
          version: tags/${{ inputs.version }}
          file: "PconnInstaller-${{ inputs.version }}-x64.msi"
          target: "./PconnInstaller-${{ inputs.version }}-x64.msi"
          token: ${{ secrets.PCONN_PAT }}

      - name: Update docs version
        run: |
          cat <<EOF > docs/source/__version__.py
          """Application Version Information."""

          VERSION = "${{ inputs.version }}"
          EOF
        shell: bash

      - name: Commit version bump to main
        run: |
          git add docs/source/__version__.py
          if git diff --quiet --cached; then
            echo "No version changes to commit."
          else
            git commit -m "Bump version to ${{ inputs.version }}"
            git push origin main
          fi
        shell: bash

      - name: Create release and upload MSI
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          files: "./PconnInstaller-${{ inputs.version }}-x64.msi"
          target_commitish: main

      - name: Merge main back into dev
        run: |
          git checkout dev
          git merge main --no-ff -m "Merge main back into dev after release ${{ inputs.version }}"
          git push origin dev

      - name: Record release summary
        run: |
          printf "Released version %s\n" "${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
